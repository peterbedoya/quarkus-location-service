version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: location_postgres
    environment:
      POSTGRES_DB: locations_db
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus -d locations_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  location-service:
    image: ghcr.io/your-username/quarkus-location-service:latest
    container_name: location_quarkus_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: locations_db
      DB_USER: quarkus
      DB_PASS: quarkus_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
